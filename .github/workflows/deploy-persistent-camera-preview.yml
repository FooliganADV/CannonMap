name: Deploy persistent camera preview

on:
  push:
    branches:
      - agent/persistent-camera-current

permissions:
  contents: read
  deployments: write

concurrency:
  group: cannonmap-persistent-camera-preview
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy exact commit to Cloudflare Pages preview
    runs-on: ubuntu-latest
    environment:
      name: cannonmap-persistent-camera-preview
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}

    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify deployment inputs
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing required repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing required repository secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test "$GITHUB_REF_NAME" = "agent/persistent-camera-current" || { echo "::error::Unexpected preview branch"; exit 1; }

      - name: Deploy repository root to cannonmap preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm
          command: >-
            pages deploy .
            --project-name=cannonmap
            --branch=agent/persistent-camera-current
            --commit-hash=${{ github.sha }}
            --commit-dirty=false

      - name: Publish deployment summary
        if: ${{ always() }}
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PREVIEW_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOYMENT_STATUS: ${{ job.status }}
        run: |
          {
            echo "## CannonMap persistent camera preview"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| Project | \`cannonmap\` |"
            echo "| Branch | \`agent/persistent-camera-current\` |"
            echo "| Status | \`${DEPLOYMENT_STATUS}\` |"
            echo "| Deployment URL | ${DEPLOYMENT_URL:-Not returned} |"
            echo "| Branch alias URL | ${PREVIEW_ALIAS_URL:-Not returned} |"
          } >> "$GITHUB_STEP_SUMMARY"
